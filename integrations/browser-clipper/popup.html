<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Save to WorkWiki</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main>
      <p class="eyebrow">PRIVATE CAPTURE</p>
      <h1>Save to WorkWiki</h1>
      <label>Page title<input id="title" maxlength="300"></label>
      <label>URL<input id="url" type="url" required></label>
      <label>Default tags<input id="tags" maxlength="400" placeholder="research, follow-up"></label>
      <p id="message" role="status"></p>
      <button id="save" type="button">Choose vault &amp; review</button>
      <small>A compact, signed-in WorkWiki window opens so you can choose the destination vault and confirm before ingesting.</small>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
