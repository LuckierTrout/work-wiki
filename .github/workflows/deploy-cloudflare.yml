name: Deploy Cloudflare Worker

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/deploy-cloudflare.yml"
      - "app/**"
      - "src/**"
      - "public/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "next.config.*"
      - "open-next.config.*"
      - "wrangler.jsonc"
      - "workers/**"

permissions:
  contents: read

concurrency:
  group: cloudflare-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify Cloudflare secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

      - name: Build Cloudflare Worker
        env:
          # Public site-owner handle — inlined into the client bundle at build
          # time so the nav can gate owner-only tools (e.g. Lint). The server
          # gates read it too. Public (not a secret); override via the repo var.
          NEXT_PUBLIC_OWNER_HANDLE: ${{ vars.NEXT_PUBLIC_OWNER_HANDLE || 'christianlee' }}
          # The owner-only deployment exposes one content-free authentication
          # route so the owner can recover after a session expires.
          NEXT_PUBLIC_CLERK_SIGN_IN_URL: /sign-in
          NEXT_PUBLIC_CLERK_SIGN_IN_FALLBACK_REDIRECT_URL: /
          # Clerk's publishable key is public but must be present at build time
          # so Next.js can inline it into the browser bundle.
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
        run: pnpm build:cloudflare

      # The main Worker has a private service binding to this container-backed
      # worker, so deploy it first. Its YOPEDIA_SANDBOX_TOKEN secret is created
      # once with Wrangler and is preserved across deployments.
      - name: Install sandbox-runner dependencies
        run: pnpm --dir workers/sandbox-runner install --frozen-lockfile

      - name: Deploy sandbox-runner Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm --dir workers/sandbox-runner exec wrangler deploy

      - name: Deploy Cloudflare Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config wrangler.jsonc

      # Standalone consumer for the agent task queue (Cloudflare Queues). Drains
      # `yopedia-tasks` and POSTs each task to the main app's /api/tasks/run.
      # Secret YOPEDIA_SERVICE_TOKEN is set once via
      # `wrangler secret put --config workers/task-consumer/wrangler.jsonc`; the
      # queue + DLQ are created once via `wrangler queues create`.
      - name: Deploy task-consumer Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config workers/task-consumer/wrangler.jsonc

      # Receives Cloudflare Email Routing events, validates approved senders in
      # shared KV, and submits the email body to the main Worker over a service
      # binding. The routing rule itself is configured once a domain is present.
      - name: Deploy email-ingest Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config workers/email-ingest/wrangler.jsonc
