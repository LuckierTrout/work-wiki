name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  application:
    name: Application
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CI: "true"
      NEXT_PUBLIC_OWNER_HANDLE: ${{ vars.NEXT_PUBLIC_OWNER_HANDLE || 'christianlee' }}
      NEXT_PUBLIC_CLERK_SIGN_IN_URL: /sign-in
      NEXT_PUBLIC_CLERK_SIGN_IN_FALLBACK_REDIRECT_URL: /
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.9

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript
        run: pnpm exec tsc --noEmit

      - name: ESLint
        run: pnpm lint

      - name: Tests
        run: pnpm test

      - name: Next.js production build
        run: pnpm build

      - name: Cloudflare production build
        run: pnpm build:cloudflare

      - name: Main Worker dry run
        run: pnpm exec wrangler deploy --dry-run --config wrangler.jsonc

  sandbox:
    name: Sandbox Worker
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.9

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: workers/sandbox-runner/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm --dir workers/sandbox-runner install --frozen-lockfile

      - name: TypeScript
        run: pnpm --dir workers/sandbox-runner exec tsc --noEmit

      - name: Container Worker dry run
        run: pnpm --dir workers/sandbox-runner exec wrangler deploy --dry-run
